services:
  - type: web
    name: campusforge-api-test
    runtime: rust
    repo: https://github.com/Sahaj-4-spec/campusforge-teams
    branch: main
    region: singapore
    plan: free
    buildCommand: cargo build --release --manifest-path server/Cargo.toml
    startCommand: ./server/target/release/campusforge-server
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campusforge-test-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://campusforge-preview.onrender.com

  - type: web
    name: campusforge-preview
    runtime: static
    repo: https://github.com/Sahaj-4-spec/campusforge-teams
    branch: main
    buildCommand: npm --prefix client install && npm --prefix client run build
    staticPublishPath: ./client/dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        value: https://campusforge-api-test.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: campusforge-test-db
    databaseName: campusforge_test_db
    user: campusforge_test_db_user
    postgresMajorVersion: "18"
    region: singapore
    plan: free
