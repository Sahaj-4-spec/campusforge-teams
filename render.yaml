services:
  - type: web
    name: campusforge-api-test
    runtime: rust
    repo: https://github.com/Sahaj-4-spec/campusforge-teams
    branch: main
    region: singapore
    plan: free
    buildCommand: cargo build --release --manifest-path server/Cargo.toml
    startCommand: ./server/target/release/campusforge-server
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      # Supply the managed Neon application database through the service secret store.
      # Keep this unsynchronized so a Blueprint refresh cannot replace the selected database.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://campusforge-preview.onrender.com
      - key: OAUTH_REDIRECT_BASE_URL
        value: https://campusforge-api-test.onrender.com
      - key: CAMPUSFORGE_AUTO_MIGRATE
        value: "false"
      - key: CAMPUSFORGE_AI_ENABLED
        value: "false"
      - key: CAMPUSFORGE_PROJECT_PULSE_ENABLED
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Integrated preview uses its branch-scoped Neon private bucket.
      # Keep preview malware scanning optional; production requires private ClamAV.
      - key: CAMPUSFORGE_ENV
        value: preview
      - key: CAMPUSFORGE_STORAGE_MODE
        value: s3
      - key: CAMPUSFORGE_REQUIRE_REMOTE_STORAGE
        value: "true"
      - key: CAMPUSFORGE_REQUIRE_MALWARE_SCAN
        value: "false"
      - key: CAMPUSFORGE_S3_BUCKET
        value: campusforge-private-uploads
      - key: CAMPUSFORGE_S3_REGION
        value: us-east-1
      - key: CAMPUSFORGE_S3_ENDPOINT_URL
        value: https://br-jolly-cell-bbbaqs0o.storage.c-15.us-east-1.aws.neon.tech
      - key: CAMPUSFORGE_S3_URL_STYLE
        value: path
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: CAMPUSFORGE_CLAMAV_ADDR
        sync: false
      - key: CAMPUSFORGE_AI_API_BASE_URL
        sync: false
      - key: CAMPUSFORGE_AI_API_KEY
        sync: false
      - key: CAMPUSFORGE_AI_MODEL
        sync: false

  - type: web
    name: campusforge-preview
    runtime: static
    repo: https://github.com/Sahaj-4-spec/campusforge-teams
    branch: main
    buildCommand: npm --prefix client install && npm --prefix client run build
    staticPublishPath: ./client/dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_BASE_URL
        value: https://campusforge-api-test.onrender.com
      - key: VITE_CAMPUSFORGE_PROJECT_PULSE_ENABLED
        value: "false"
      - key: VITE_CAMPUSFORGE_AI_ENABLED
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: campusforge-test-db
    databaseName: campusforge_test_db
    user: campusforge_test_db_user
    postgresMajorVersion: "18"
    region: singapore
    plan: free
