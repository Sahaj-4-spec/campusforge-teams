name: CampusForge CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, 'track-a/**', 'track-b/**', 'feature/**', 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package.json
      - name: Install frontend dependencies
        run: npm --prefix client install
      - name: Build frontend
        run: npm --prefix client run build
      - name: Test Save Locker encryption
        run: npm --prefix client run test:locker
      - name: Test optimistic Kanban task moves
        run: npm --prefix client run test:task-move
      - name: Test command palette search ranking
        run: npm --prefix client run test:command-search

  backend:
    name: Rust backend check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: campusforge
          POSTGRES_PASSWORD: campusforge
          POSTGRES_DB: campusforge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campusforge -d campusforge_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://campusforge:campusforge@localhost:5432/campusforge_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check Rust backend
        run: cargo check --manifest-path server/Cargo.toml
      - name: Run Rust unit tests
        run: cargo test --manifest-path server/Cargo.toml
