name: CampusForge Security

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm --prefix client install
      - name: Audit frontend dependencies
        run: npm --prefix client audit --audit-level=high
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Rust dependency lockfile
        run: cargo generate-lockfile --manifest-path server/Cargo.toml
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Verify vulnerable or disallowed crates are absent from active dependencies
        run: |
          cargo tree --manifest-path server/Cargo.toml --edges normal,build --prefix none > /tmp/campusforge-active-dependencies.txt
          if grep -E '^(libsqlite3-sys|rsa) v' /tmp/campusforge-active-dependencies.txt; then
            echo "::error::SQLite or RSA is present in the active backend dependency graph"
            exit 1
          fi
          if grep -E '^(h2 v0[.]3[.]27|rustls v0[.]21[.]12|rustls-webpki v0[.]101[.]7)$' /tmp/campusforge-active-dependencies.txt; then
            echo "::error::A vulnerable legacy HTTP/TLS crate remains in the active dependency graph"
            exit 1
          fi
      - name: Audit Rust dependencies
        run: cargo audit --file server/Cargo.lock --ignore RUSTSEC-2026-0459 --ignore RUSTSEC-2023-0071

  codeql:
    name: CodeQL JavaScript analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
