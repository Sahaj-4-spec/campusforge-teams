name: CampusForge Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm --prefix client install
      - name: Audit frontend dependencies
        run: npm --prefix client audit --audit-level=high
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Rust dependency lockfile
        run: cargo generate-lockfile --manifest-path server/Cargo.toml
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Audit Rust dependencies
        run: cargo audit --file server/Cargo.lock

  codeql:
    name: CodeQL JavaScript analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
