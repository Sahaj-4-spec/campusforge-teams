name: CampusForge Security

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install frontend dependencies
        run: npm --prefix client install
      - name: Audit frontend dependencies
        run: npm --prefix client audit --audit-level=high
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Rust dependency lockfile
        run: cargo generate-lockfile --manifest-path server/Cargo.toml
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Cargo.lock can contain optional feature dependencies that are not compiled.
      # Verify the advisory crates are absent from the active normal/build dependency graph
      # before excluding their lockfile-only advisories from cargo-audit.
      - name: Verify optional vulnerable crates are not enabled
        run: |
          cargo tree --manifest-path server/Cargo.toml --edges normal,build --prefix none > /tmp/campusforge-dependencies.txt
          if grep -E '^(libsqlite3-sys|rsa) v' /tmp/campusforge-dependencies.txt; then
            echo "::error::SQLite or RSA is present in the active backend dependency graph"
            exit 1
          fi
      - name: Inspect legacy HTTP and TLS dependency paths
        run: |
          cargo tree --manifest-path server/Cargo.toml --invert h2@0.3.27 || true
          cargo tree --manifest-path server/Cargo.toml --invert rustls@0.21.12 || true
          cargo tree --manifest-path server/Cargo.toml --invert rustls-webpki@0.101.7 || true
      - name: Audit Rust dependencies
        run: cargo audit --file server/Cargo.lock --ignore RUSTSEC-2026-0459 --ignore RUSTSEC-2023-0071

  codeql:
    name: CodeQL JavaScript analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3
